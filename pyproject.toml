[project]
name = "lova-hr"
version = "0.1.0"
description = "LOVA_HR — Hybrid Lexical + Semantic RAG Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5.0",
    "docx2txt>=0.9",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "numpy>=1.26.0",
    "pymupdf>=1.24.0",
    "pypdf>=4.0.0",
    "python-dotenv>=1.0.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=2.7.0",
    "streamlit>=1.35.0",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
]
